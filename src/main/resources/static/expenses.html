<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - Expense Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e1e4e8;
            min-height: 100vh;
        }

        /* Navigation */
        .nav {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 16px 24px;
            background: #1c1f26;
            border-bottom: 1px solid #2d333b;
        }

        .nav-brand {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-brand span { color: #58a6ff; }

        .nav-links { display: flex; gap: 4px; }

        .nav-link {
            padding: 8px 16px;
            border-radius: 6px;
            color: #8b949e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-link:hover { background: #252830; color: #e1e4e8; }
        .nav-link.active { background: #58a6ff; color: #ffffff; }

        .nav-right { margin-left: auto; }

        .logout-btn {
            padding: 8px 16px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid #2d333b;
            color: #8b949e;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover { background: #da3633; color: #ffffff; border-color: #da3633; }

        /* Main content */
        .container { padding: 24px; max-width: 1200px; margin: 0 auto; }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #58a6ff;
            color: #ffffff;
        }

        .btn-primary:hover { background: #4a90e2; }

        .btn-secondary {
            background: #252830;
            color: #e1e4e8;
            border: 1px solid #2d333b;
        }

        .btn-secondary:hover { background: #2d333b; }

        .btn-danger {
            background: transparent;
            color: #ff7b72;
            border: 1px solid #ff7b72;
        }

        .btn-danger:hover { background: #ff7b72; color: #ffffff; }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        /* Table */
        .table-card {
            background: #1c1f26;
            border: 1px solid #2d333b;
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 12px;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px 16px;
            border-bottom: 1px solid #2d333b;
            background: #161920;
        }

        tbody td {
            padding: 14px 16px;
            font-size: 14px;
            border-bottom: 1px solid #2d333b;
        }

        tbody tr:last-child td { border-bottom: none; }

        tbody tr:hover { background: #252830; }

        .amount-cell {
            font-weight: 600;
            color: #58a6ff;
        }

        .category-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            background: #252830;
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: #484f58;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #8b949e;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #1c1f26;
            border: 1px solid #2d333b;
            border-radius: 12px;
            width: 480px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid #2d333b;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .modal-close {
            background: none;
            border: none;
            color: #8b949e;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .modal-close:hover { color: #ffffff; }

        .modal-body { padding: 24px; }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #2d333b;
            border-radius: 6px;
            background: #0f1117;
            color: #e1e4e8;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .form-group textarea { resize: vertical; min-height: 60px; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 16px 24px;
            border-top: 1px solid #2d333b;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            z-index: 200;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #238636; color: #ffffff; }
        .toast.error { background: #da3633; color: #ffffff; }

        /* Delete confirmation modal */
        .confirm-text {
            font-size: 15px;
            color: #e1e4e8;
            line-height: 1.5;
        }

        .confirm-text strong { color: #ff7b72; }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .page-header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .form-row { grid-template-columns: 1fr; }
            .actions-cell { flex-direction: column; }
            table { font-size: 13px; }
            thead th, tbody td { padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="/" class="nav-brand"><span>$</span> Expense Tracker</a>
        <div class="nav-links">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/expenses.html" class="nav-link active">Expenses</a>
            <a href="/merchants.html" class="nav-link">Merchants</a>
        </div>
        <div class="nav-right">
            <form action="/logout" method="POST" style="margin:0">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>All Expenses</h2>
            <button class="btn btn-primary" onclick="openAddModal()">+ Add Expense</button>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Merchant</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Payment</th>
                        <th>Notes</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody">
                    <tr>
                        <td colspan="7" class="empty-state">
                            <h3>Loading...</h3>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="expenseModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Expense</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="expenseForm" onsubmit="handleSubmit(event)">
                    <input type="hidden" id="expenseId">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount *</label>
                            <input type="number" id="amount" step="0.01" min="0.01" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label for="merchant">Merchant *</label>
                            <input type="text" id="merchant" required placeholder="e.g. Maxi, IGA">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category">
                                <option value="">Auto-detect (AI)</option>
                                <optgroup label="Food">
                                    <option value="Groceries">Groceries</option>
                                    <option value="Restaurants">Restaurants</option>
                                    <option value="Coffee & Cafes">Coffee & Cafes</option>
                                    <option value="Fast Food">Fast Food</option>
                                    <option value="Bars & Alcohol">Bars & Alcohol</option>
                                </optgroup>
                                <optgroup label="Transportation">
                                    <option value="Gas & Fuel">Gas & Fuel</option>
                                    <option value="Public Transit">Public Transit</option>
                                    <option value="Rideshare & Taxi">Rideshare & Taxi</option>
                                    <option value="Parking">Parking</option>
                                    <option value="Car Maintenance">Car Maintenance</option>
                                </optgroup>
                                <optgroup label="Housing">
                                    <option value="Rent & Mortgage">Rent & Mortgage</option>
                                    <option value="Utilities">Utilities</option>
                                    <option value="Internet & Phone">Internet & Phone</option>
                                    <option value="Insurance">Insurance</option>
                                </optgroup>
                                <optgroup label="Shopping">
                                    <option value="Clothing">Clothing</option>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Home & Garden">Home & Garden</option>
                                </optgroup>
                                <optgroup label="Health">
                                    <option value="Pharmacy">Pharmacy</option>
                                    <option value="Doctor & Dental">Doctor & Dental</option>
                                    <option value="Gym & Fitness">Gym & Fitness</option>
                                </optgroup>
                                <optgroup label="Entertainment">
                                    <option value="Subscriptions">Subscriptions</option>
                                    <option value="Streaming">Streaming</option>
                                    <option value="Movies & Events">Movies & Events</option>
                                    <option value="Gaming">Gaming</option>
                                </optgroup>
                                <optgroup label="Travel">
                                    <option value="Flights">Flights</option>
                                    <option value="Hotels">Hotels</option>
                                    <option value="Car Rental">Car Rental</option>
                                </optgroup>
                                <optgroup label="Other">
                                    <option value="Education">Education</option>
                                    <option value="Gifts & Donations">Gifts & Donations</option>
                                    <option value="Pet Care">Pet Care</option>
                                    <option value="Personal Care">Personal Care</option>
                                    <option value="Bank & Fees">Bank & Fees</option>
                                    <option value="Other">Other</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="paymentMethod">Payment Method</label>
                            <select id="paymentMethod" onchange="toggleCardName()">
                                <option value="Card">Card</option>
                                <option value="Cash">Cash</option>
                                <option value="Transfer">Transfer</option>
                                <option value="Debit">Debit</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="cardNameGroup">
                        <label for="cardName">Card Name</label>
                        <input type="text" id="cardName" placeholder="e.g. Elite World">
                    </div>
                    <div class="form-group">
                        <label for="timestamp">Date & Time</label>
                        <input type="datetime-local" id="timestamp">
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" placeholder="Optional notes..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="document.getElementById('expenseForm').requestSubmit()">Save</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="width: 400px;">
            <div class="modal-header">
                <h3>Delete Expense</h3>
                <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p class="confirm-text">Are you sure you want to delete this expense?<br><br>
                <strong id="deleteInfo"></strong><br><br>
                This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const CATEGORY_COLORS = {
            // Food
            'Groceries':       '#58a6ff',
            'Restaurants':     '#3b82f6',
            'Coffee & Cafes':  '#8b5cf6',
            'Fast Food':       '#f59e0b',
            'Bars & Alcohol':  '#ec4899',
            // Transportation
            'Gas & Fuel':      '#f97316',
            'Public Transit':  '#06b6d4',
            'Rideshare & Taxi':'#14b8a6',
            'Parking':         '#64748b',
            'Car Maintenance': '#78716c',
            // Housing
            'Rent & Mortgage': '#6366f1',
            'Utilities':       '#8b5cf6',
            'Internet & Phone':'#a78bfa',
            'Insurance':       '#7c3aed',
            // Shopping
            'Clothing':        '#f78166',
            'Electronics':     '#fb923c',
            'Home & Garden':   '#84cc16',
            // Health
            'Pharmacy':        '#ff7b72',
            'Doctor & Dental': '#ef4444',
            'Gym & Fitness':   '#10b981',
            // Entertainment
            'Subscriptions':   '#ffa657',
            'Streaming':       '#e879f9',
            'Movies & Events': '#c084fc',
            'Gaming':          '#22d3ee',
            // Travel
            'Flights':         '#d2a8ff',
            'Hotels':          '#a5b4fc',
            'Car Rental':      '#93c5fd',
            // Other
            'Education':       '#7ee787',
            'Gifts & Donations':'#fbbf24',
            'Pet Care':        '#a3e635',
            'Personal Care':   '#f472b6',
            'Bank & Fees':     '#94a3b8',
            'Other':           '#6b7280',
            'Uncategorized':   '#484f58'
        };

        let deleteTargetId = null;

        // Fetch and render expenses
        async function fetchExpenses() {
            try {
                const res = await fetch('/api/expenses');
                const expenses = await res.json();
                renderTable(expenses);
            } catch (err) {
                console.error('Failed to fetch expenses:', err);
                document.getElementById('expenseTableBody').innerHTML =
                    '<tr><td colspan="7" class="empty-state"><h3>Failed to load expenses</h3></td></tr>';
            }
        }

        function renderTable(expenses) {
            const tbody = document.getElementById('expenseTableBody');

            if (!expenses || expenses.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="7" class="empty-state">
                        <h3>No expenses yet</h3>
                        <p>Click "Add Expense" to get started</p>
                    </td></tr>`;
                return;
            }

            tbody.innerHTML = expenses.map(exp => {
                const date = new Date(exp.timestamp);
                const dateStr = date.toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: 'numeric' });
                const timeStr = date.toLocaleTimeString('en-CA', { hour: '2-digit', minute: '2-digit' });
                const color = CATEGORY_COLORS[exp.category] || '#484f58';

                return `
                    <tr>
                        <td>${dateStr}<br><span style="font-size:12px;color:#484f58">${timeStr}</span></td>
                        <td>${escapeHtml(exp.merchant)}</td>
                        <td><span class="category-badge" style="color:${color};border:1px solid ${color}33">${escapeHtml(exp.category)}</span></td>
                        <td class="amount-cell">$${parseFloat(exp.amount).toFixed(2)}</td>
                        <td>${escapeHtml(exp.paymentMethod || 'Card')}${exp.cardName ? '<br><span style="font-size:12px;color:#484f58">' + escapeHtml(exp.cardName) + '</span>' : ''}</td>
                        <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(exp.notes || '-')}</td>
                        <td>
                            <div class="actions-cell">
                                <button class="btn btn-secondary btn-sm" onclick='openEditModal(${JSON.stringify(exp)})'>Edit</button>
                                <button class="btn btn-danger btn-sm" onclick='openDeleteModal("${exp.id}", "${escapeHtml(exp.merchant)}", ${parseFloat(exp.amount).toFixed(2)})'>Delete</button>
                            </div>
                        </td>
                    </tr>`;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function toggleCardName() {
            const method = document.getElementById('paymentMethod').value;
            const cardGroup = document.getElementById('cardNameGroup');
            cardGroup.style.display = (method === 'Card' || method === 'Debit') ? 'block' : 'none';
            if (method !== 'Card' && method !== 'Debit') {
                document.getElementById('cardName').value = '';
            }
        }

        // Add modal
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Expense';
            document.getElementById('expenseId').value = '';
            document.getElementById('expenseForm').reset();
            document.getElementById('paymentMethod').value = 'Card';
            toggleCardName();
            // Set default datetime to now
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('timestamp').value = now.toISOString().slice(0, 16);
            document.getElementById('expenseModal').classList.add('active');
        }

        // Edit modal
        function openEditModal(exp) {
            document.getElementById('modalTitle').textContent = 'Edit Expense';
            document.getElementById('expenseId').value = exp.id;
            document.getElementById('amount').value = parseFloat(exp.amount);
            document.getElementById('merchant').value = exp.merchant;
            document.getElementById('category').value = exp.category || '';
            document.getElementById('paymentMethod').value = exp.paymentMethod || 'Card';
            document.getElementById('cardName').value = exp.cardName || '';
            toggleCardName();
            document.getElementById('notes').value = exp.notes || '';
            if (exp.timestamp) {
                const dt = new Date(exp.timestamp);
                dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset());
                document.getElementById('timestamp').value = dt.toISOString().slice(0, 16);
            }
            document.getElementById('expenseModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('expenseModal').classList.remove('active');
        }

        // Delete modal
        function openDeleteModal(id, merchant, amount) {
            deleteTargetId = id;
            document.getElementById('deleteInfo').textContent = `${merchant} — $${amount}`;
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deleteTargetId = null;
        }

        async function confirmDelete() {
            if (!deleteTargetId) return;
            try {
                const res = await fetch(`/api/expenses/${deleteTargetId}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast('Expense deleted', 'success');
                    closeDeleteModal();
                    fetchExpenses();
                } else {
                    const err = await res.json();
                    showToast(err.message || 'Delete failed', 'error');
                }
            } catch (err) {
                showToast('Delete failed', 'error');
            }
        }

        // Form submit
        async function handleSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('expenseId').value;
            const isEdit = !!id;

            const body = {
                amount: parseFloat(document.getElementById('amount').value),
                merchant: document.getElementById('merchant').value,
                category: document.getElementById('category').value || null,
                paymentMethod: document.getElementById('paymentMethod').value,
                cardName: document.getElementById('cardName').value || null,
                notes: document.getElementById('notes').value || null,
                timestamp: document.getElementById('timestamp').value ? document.getElementById('timestamp').value + ':00' : null
            };

            try {
                const url = isEdit ? `/api/expenses/${id}` : '/api/expenses';
                const method = isEdit ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    showToast(isEdit ? 'Expense updated' : 'Expense added', 'success');
                    closeModal();
                    fetchExpenses();
                } else {
                    const err = await res.json();
                    showToast(err.message || 'Save failed', 'error');
                }
            } catch (err) {
                showToast('Save failed', 'error');
            }
        }

        // Toast
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Close modals on overlay click
        document.getElementById('expenseModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) closeDeleteModal();
        });

        // Close modals on Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeDeleteModal();
            }
        });

        // Init
        fetchExpenses();
    </script>
</body>
</html>
