<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e1e4e8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #1c1f26;
            border: 1px solid #2d333b;
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            max-width: 90vw;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .login-header h1 span {
            color: #58a6ff;
        }

        .login-header p {
            font-size: 14px;
            color: #8b949e;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #2d333b;
            border-radius: 8px;
            background: #0f1117;
            color: #e1e4e8;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #58a6ff;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }

        .btn-login:hover {
            background: #4a90e2;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: rgba(218, 54, 51, 0.15);
            border: 1px solid #da3633;
            color: #ff7b72;
        }

        .alert-success {
            background: rgba(35, 134, 54, 0.15);
            border: 1px solid #238636;
            color: #7ee787;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1><span>$</span> Expense Tracker</h1>
            <p>Sign in to your dashboard</p>
        </div>

        <div id="errorAlert" class="alert alert-error" style="display: none;">
            Invalid username or password
        </div>

        <div id="logoutAlert" class="alert alert-success" style="display: none;">
            You have been logged out
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === 'true') {
            document.getElementById('errorAlert').style.display = 'block';
        }
        if (params.get('logout') === 'true') {
            document.getElementById('logoutAlert').style.display = 'block';
        }
    </script>
</body>
</html>
