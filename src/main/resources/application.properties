# Application
spring.application.name=expense-tracker-api

# Database Configuration
# Default values for local development (can be overridden by environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:expenseuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:expensepass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Montreal

# Anthropic Claude API
anthropic.api.key=${ANTHROPIC_API_KEY:}


# Server
server.port=8080

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Resend Email API
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${RESEND_FROM_ADDRESS:Spendifi <noreply@yourdomain.com>}

# Monthly Insights Email
insights.email.enabled=${INSIGHTS_EMAIL_ENABLED:true}

# Session cookie hardening. CSRF protection is disabled for /api/** (the SPA
# uses fetch with session cookies), so SameSite=Lax is the backstop that
# prevents cross-site requests from riding the session cookie.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
