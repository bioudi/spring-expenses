# Application
spring.application.name=expense-tracker-api

# Database Configuration
# Default values for local development (can be overridden by environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expense_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:expenseuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:expensepass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API Security
api.key=${API_KEY:dev-api-key-change-in-production}

# Anthropic Claude API
anthropic.api.key=${ANTHROPIC_API_KEY:}

# Dashboard Login
dashboard.username=${DASHBOARD_USERNAME:admin}
dashboard.password=${DASHBOARD_PASSWORD:admin}


# Server
server.port=8080

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Monthly Insights Email
insights.email.enabled=${INSIGHTS_EMAIL_ENABLED:true}
insights.email.from=${MAIL_USERNAME:}
insights.email.recipients=bioudiamine@gmail.com,sebbahichaimaa@gmail.com
